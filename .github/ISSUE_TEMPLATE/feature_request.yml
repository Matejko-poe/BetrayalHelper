name: Feature request
description: Suggest a strategy, parser, or usability improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What board state or workflow is not handled well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include concrete encounter text and expected decisions when possible.
    validations:
      required: true
